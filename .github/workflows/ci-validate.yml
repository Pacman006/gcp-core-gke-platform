name: CI Validate (App, IaC, K8s & Security)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  app-tests:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r app/requirements-test.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  terraform-validate:
    name: Terraform Validate & TFLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "~1.9.0"

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform

      - name: Validate dev and prod environments
        run: |
          for env in dev prod; do
            if [ -d "terraform/environments/$env" ]; then
              echo "==> Validating terraform/environments/$env"
              terraform -chdir="terraform/environments/$env" init -backend=false
              terraform -chdir="terraform/environments/$env" validate
              (cd "terraform/environments/$env" && tflint --init && tflint)
            fi
          done

  kustomize-validate:
    name: Kustomize Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build local and prod overlays
        run: |
          for overlay in local prod; do
            if [ -d "k8s/overlays/$overlay" ]; then
              echo "==> Rendering k8s/overlays/$overlay"
              kubectl kustomize "k8s/overlays/$overlay" > /dev/null
            fi
          done

  container-security:
    name: Docker Build & Trivy Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build multi-stage Docker image
        run: docker build -t platform-api:ci app

      - name: Run Trivy vulnerability scan (CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "platform-api:ci"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL"
